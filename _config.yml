title: Differentiable & Hybrid Modeling for Hydrologic Systems
author: Bennett Hydro Lab, University of Arizona
copyright: "2026"
logo: ""

only_build_toc_files: true

# Without this, Sphinx walks the whole tree: it picks up READMEs from .venv
# site-packages and, worse, tries to execute the reference notebooks in refs/
# (one of which takes 20-60 minutes). Keep this list tight.
exclude_patterns:
  - .venv
  - _build
  - refs
  - tools
  - "**.ipynb_checkpoints"

execute:
  execute_notebooks: cache
  timeout: 900
  allow_errors: false

bibtex_bibfiles:
  - references.bib

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - colon_fence
    - deflist
    - html_image
    - linkify

sphinx:
  config:
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    bibtex_reference_style: author_year
    html_show_copyright: false

repository:
  url: https://github.com/BennettHydroLab/differentiable_modeling_workshop
  path_to_book: .
  branch: main

launch_buttons:
  colab_url: "https://colab.research.google.com"
  notebook_interface: jupyterlab

html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: false
  home_page_in_navbar: true
  baseurl: https://BennettHydroLab.github.io/differentiable_modeling_workshop/
